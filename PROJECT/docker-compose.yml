version: '3.8'

services:
  # ----------------------------------------------------
  # 1. MongoDB Database
  # ----------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: algoflow-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: algoflow
    volumes:
      - mongodb_data:/data/db
    networks:
      - algoflow-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 2. Redis Cache & BullMQ Queue Broker
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: algoflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - algoflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 3. API Gateway REST Service
  # ----------------------------------------------------
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: algoflow-api-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/algoflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: algoflow_production_secret_key_2026
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - algoflow-network

  # ----------------------------------------------------
  # 4. Judge Worker Execution Service (2 Replicas)
  # ----------------------------------------------------
  judge-worker:
    build:
      context: ./backend/judge-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/algoflow
      REDIS_URL: redis://redis:6379
      MAX_CONCURRENT_JOBS: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-gateway:
        condition: service_started
    deploy:
      replicas: 2
    networks:
      - algoflow-network

  # ----------------------------------------------------
  # 5. Contest & Real-Time WebSocket Service
  # ----------------------------------------------------
  contest-service:
    build:
      context: ./backend/contest-service
      dockerfile: Dockerfile
    container_name: algoflow-contest-service
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/algoflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: algoflow_production_secret_key_2026
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - algoflow-network

  # ----------------------------------------------------
  # 6. Plagiarism & Token Fingerprinting Service
  # ----------------------------------------------------
  plagiarism-service:
    build:
      context: ./backend/plagiarism-service
      dockerfile: Dockerfile
    container_name: algoflow-plagiarism-service
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/algoflow
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - algoflow-network

  # ----------------------------------------------------
  # 7. React Frontend Client (Vite + Nginx)
  # ----------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algoflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
      - contest-service
    networks:
      - algoflow-network

# ----------------------------------------------------
# Persistent Volumes
# ----------------------------------------------------
volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

# ----------------------------------------------------
# Network Bridge
# ----------------------------------------------------
networks:
  algoflow-network:
    driver: bridge
